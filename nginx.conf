server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Astro hashed build output — safe to cache forever
    # (^~ so this prefix beats the asset regex below; add_header does not
    # inherit once a location declares its own, so headers are repeated.)
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
        try_files $uri =404;
    }

    # Unhashed public files (favicon, etc.) — short cache so updates land
    location ~* \.(?:ico|svg|png|jpe?g|gif|webp|avif|woff2?|ttf|txt|xml|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # Pages — always revalidate so a redeploy is visible immediately
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Serve the directory index directly (no 301 to a trailing slash) so
        # URLs stay identical to the canonical URLs Astro emits.
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
    }
}
