name: Build and Deploy to Dokploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  repository_dispatch:
    types: [sanity-update]

# Prevent overlapping builds on same ref; cancel older in-progress runs
concurrency:
  group: deploy-${{ github.ref }}-${{ (github.event_name == 'repository_dispatch' && github.event.action == 'sanity-update') && 'content' || 'code' }}
  cancel-in-progress: true

# Least-privilege: build job only needs to read the repo
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      # Note: DOCKERHUB_USERNAME/TOKEN are scoped to the login step only — not exposed job-wide.
      IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_IMAGE_NAME }}
      PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
      # Unique token only for content update events; empty for normal code pushes (preserves build cache)
      CONTENT_UPDATE_TOKEN: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'sanity-update' && github.run_id || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          build-args: |
            PUBLIC_SANITY_PROJECT_ID=${{ env.PUBLIC_SANITY_PROJECT_ID }}
            PUBLIC_SANITY_DATASET=${{ env.PUBLIC_SANITY_DATASET }}
            PUBLIC_SITE_URL=${{ env.PUBLIC_SITE_URL }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp || '' }}
            CONTENT_UPDATE_TOKEN=${{ env.CONTENT_UPDATE_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deployment:
    needs: build-and-push
    uses: ./.github/workflows/trigger-deploy.yml
    secrets:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      DOKPLOY_DEPLOY_HOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_HOOK_URL }}
